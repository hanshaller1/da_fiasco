<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>DEBACLE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="DEBACLE — a browser instrument that turns one audio loop into a performance: varispeed tape, beat-grid stutter, circuit-bent buffers, grain stretch, an effect chain, modulators and macros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>/* Layout: a studio rack — header strip, page tabs, page body, MAIN row docked at the bottom.
   One deliberate visual world: warm oxide-brown hardware, amber VU light, teal modulation. */
:root {
  color-scheme: dark;
  --bg: #14110e;
  --panel: #1d1914;
  --panel-2: #28221c;
  --line: #3a3128;
  --line-2: #51453a;
  --fg: #efe5d3;
  --fg-dim: #a39581;
  --fg-faint: #6f6355;
  --accent: #f2a03d;
  --accent-fill: rgba(242, 160, 61, 0.2);
  --mod: #6fc7b6;
  --mod-fill: rgba(111, 199, 182, 0.16);
  --warn: #ec5e3e;
  --c-distortion: #e8784a; --c-dynamics: #d8b54c; --c-filter: #a3c85b; --c-modulation: #6fc7b6; --c-spectral: #9aa5f4;
  --c-pitch: #c592f0; --c-resonator: #ef8fb8; --c-granular: #5cb3e2; --c-delay: #e2c493; --c-reverb: #a8c1cf; --c-glitch: #f05d72;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 5px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 13px/1.35 var(--f-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; }
input, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--fg-dim); }
.small { font-size: 11.5px; }
.app { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }

/* ---------------------------------------------------------------- header */
.top { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "brand transport meter" "preset globals globals"; gap: 10px 18px; align-items: center; padding-block: 14px 10px; }
.brand { grid-area: brand; display: flex; align-items: center; gap: 10px; }
.reels .reel-o { fill: var(--panel-2); stroke: var(--fg-dim); stroke-width: 1.4; }
.reels .reel-hub { fill: var(--fg-dim); }
.reels .reel-sp { stroke: var(--bg); stroke-width: 3.2; stroke-linecap: round; }
.reels .reel-tape { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.wordmark { font: 900 34px/0.9 var(--f-display); letter-spacing: 0.06em; color: var(--fg); }
.tagline { font: 500 10.5px var(--f-mono); color: var(--fg-dim); letter-spacing: 0.08em; margin-top: 3px; text-transform: uppercase; }
.transport { grid-area: transport; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.play { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 14px; border-radius: 20px; border: 0; background: var(--accent); color: #1a1208; font: 700 15px var(--f-display); letter-spacing: 0.1em; cursor: pointer; }
.play svg { fill: currentColor; }
.play .ic-stop { display: none; }
body.playing .play { background: var(--fg); }
body.playing .play .ic-stop { display: block; }
body.playing .play .ic-play { display: none; }
.bpm-box { display: flex; align-items: center; gap: 6px; }
.bpm-box label { font: 600 10.5px var(--f-mono); color: var(--fg-dim); letter-spacing: 0.08em; }
#bpm { width: 64px; height: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 0 6px; font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; }
.src-box { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sources { display: flex; gap: 4px; flex-wrap: wrap; }
.src-btn { height: 24px; padding: 0 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; font: 600 11px var(--f-mono); letter-spacing: 0.05em; color: var(--fg-dim); cursor: pointer; }
.src-btn:hover { color: var(--fg); border-color: var(--line-2); }
.src-btn.on { background: var(--panel-2); color: var(--accent); border-color: var(--accent); }
.src-wave { position: relative; height: 30px; width: min(320px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.src-wave canvas { width: 100%; height: 100%; display: block; opacity: 0.8; }
#src-head { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-left: 2px solid var(--accent); pointer-events: none; }
#src-name { position: absolute; right: 6px; top: 2px; font: 600 10px var(--f-mono); color: var(--fg); background: var(--panel); padding: 0 4px; border-radius: 3px; }
.src-extra { display: flex; gap: 6px; }
#print-btn.rec { color: var(--warn); border-color: var(--warn); animation: blink 0.8s steps(2) infinite; }
#mic-btn.on { color: var(--mod); border-color: var(--mod); }
@keyframes blink { 50% { opacity: 0.45; } }
.presetbar { grid-area: preset; display: flex; align-items: center; gap: 4px; }
.preset-name { display: inline-flex; align-items: center; gap: 8px; min-width: 210px; height: 32px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); font: 700 17px var(--f-display); letter-spacing: 0.06em; cursor: pointer; justify-content: space-between; }
.preset-name:hover { border-color: var(--line-2); }
.dirty-dot { color: var(--accent); font-size: 10px; }
.globals { grid-area: globals; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.keybox { display: flex; gap: 4px; flex-wrap: wrap; }
.dicebox { display: flex; gap: 8px; }
.dice-g { display: flex; align-items: center; gap: 4px; font: 600 10.5px var(--f-mono); color: var(--fg-dim); }
.meter-box { grid-area: meter; display: flex; align-items: center; gap: 6px; }
#scope { width: 200px; height: 52px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.meters { display: flex; gap: 3px; height: 52px; }
.meters span { width: 7px; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; display: flex; align-items: flex-end; }
.meters i { display: block; width: 100%; height: 100%; transform-origin: bottom; transform: scaleY(0); background: linear-gradient(to top, var(--mod) 0 60%, var(--accent) 60% 88%, var(--warn) 88%); }
.gr { font: 600 9.5px var(--f-mono); color: var(--fg-faint); writing-mode: vertical-rl; letter-spacing: 0.1em; }
.gr.on { color: var(--warn); }

/* ------------------------------------------------------------------ tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: stretch; gap: 2px; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { position: relative; border: 0; background: none; padding: 10px 16px 9px; font: 800 18px var(--f-display); letter-spacing: 0.08em; color: var(--fg-faint); cursor: pointer; display: flex; align-items: baseline; gap: 6px; }
.tab .tab-n { font: 500 10px var(--f-mono); color: var(--fg-faint); }
.tab:hover { color: var(--fg-dim); }
.tab.on { color: var(--fg); }
.tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; background: var(--accent); }
.info { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 4px; font: 500 12px var(--f-mono); min-width: 0; overflow: hidden; white-space: nowrap; }
.info-name { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; }
.info-val { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 7px; border-bottom: 1px solid var(--line); min-width: 0; }
.panel-title { font: 800 19px/1 var(--f-display); letter-spacing: 0.07em; margin: 0; }
.panel-sub { font: 500 10.5px var(--f-mono); color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.panel-tools { margin-left: auto; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
.panel-body { padding: 10px; display: flex; flex-direction: column; gap: 12px; transition: opacity 0.2s; }
.panel.is-off .panel-body > :not(.viz) { opacity: 0.55; }
.panel.is-off .viz { opacity: 0.4; }
.panel.busy .panel-title { color: var(--accent); }
.section-title { font: 800 22px var(--f-display); letter-spacing: 0.08em; margin: 22px 0 10px; color: var(--fg-dim); }
.page-intro { max-width: 80ch; margin: 0 0 12px; }
.mini-title { font: 600 11px var(--f-mono); color: var(--fg-dim); margin: 0 0 6px; letter-spacing: 0.06em; }

.btn { height: 30px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel-2); font: 600 11.5px var(--f-mono); letter-spacing: 0.05em; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--fg-dim); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 10.5px; }
.btn.ghost { background: transparent; }
.btn.primary { background: var(--accent); color: #1a1208; border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; background: none; color: var(--fg-dim); border-radius: var(--r); cursor: pointer; font-size: 14px; }
.icon-btn:hover:not(:disabled) { color: var(--fg); background: var(--panel-2); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.icon-btn.sm { width: 22px; height: 22px; font-size: 13px; }
.dice.roll svg { animation: roll 0.45s ease-out; }
@keyframes roll { from { transform: rotate(-200deg) scale(0.7); } to { transform: none; } }

.power { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--bg); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; padding: 0; }
.power-led { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); transition: background 0.15s, box-shadow 0.15s; }
.power.on { border-color: var(--accent); }
.power.on .power-led { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ----------------------------------------------------------------- knobs */
.kgrid { display: flex; flex-wrap: wrap; gap: 10px 4px; align-items: flex-start; }
.knob { position: relative; width: 60px; display: flex; flex-direction: column; align-items: center; cursor: ns-resize; user-select: none; -webkit-user-select: none; touch-action: none; border-radius: var(--r); padding: 2px 0; }
.knob.big { width: 84px; }
.knob:focus-visible { outline-offset: 0; }
.knob-svg { display: block; overflow: visible; }
.k-track { fill: none; stroke: var(--line); stroke-width: 3.4; stroke-linecap: round; }
.k-val { fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; }
.k-mod { fill: none; stroke: var(--mod); stroke-width: 2; stroke-linecap: round; opacity: 0.85; }
.k-dot { fill: var(--mod); }
.k-cap { fill: var(--panel-2); stroke: var(--line-2); stroke-width: 1; }
.k-ptr { stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; }
.k-value { font: 500 10.5px var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: -1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.k-label { font: 600 10px var(--f-ui); color: var(--fg-dim); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; line-height: 1.1; max-width: 100%; }
.k-label.long { font-size: 8.6px; letter-spacing: 0.02em; }
.knob.big .k-value { font-size: 12px; }
.knob.big .k-label { font-size: 11px; }
.knob.drag .k-val, .knob:hover .k-val { stroke: #ffb653; }
.knob.modded .k-val { stroke: var(--fg-faint); }
.knob.modded .k-cap { opacity: 0.55; }
.knob.modded .k-value { color: var(--mod); }
.k-badge { position: absolute; top: -3px; right: 0; font: 600 8.5px var(--f-mono); color: var(--bg); background: var(--mod); padding: 1px 3px; border-radius: 3px; cursor: pointer; z-index: 1; max-width: 60px; overflow: hidden; white-space: nowrap; }
.k-badge:empty { display: none; }
.flash { animation: flash 0.9s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }

.tog { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--bg); color: var(--fg-dim); font: 600 10.5px var(--f-mono); letter-spacing: 0.05em; cursor: pointer; white-space: nowrap; }
.tog:hover { color: var(--fg); }
.tog.on { color: #1a1208; background: var(--fg-dim); border-color: var(--fg-dim); }
.tog.accent.on { background: var(--accent); border-color: var(--accent); }
.tog.warn.on { background: var(--warn); border-color: var(--warn); color: #fff; }
.tog.modded { box-shadow: inset 0 0 0 1px var(--mod); }
.stop-btn { border-color: var(--warn); color: var(--warn); }
.stop-btn.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 0 9px; height: 26px; font: 600 10.5px var(--f-mono); letter-spacing: 0.04em; color: var(--fg-dim); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--panel-2); color: var(--accent); }
.seg.modded { border-color: var(--mod); }
.sel { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); cursor: pointer; max-width: 100%; }
.sel-label { font: 600 9.5px var(--f-ui); color: var(--fg-dim); letter-spacing: 0.06em; }
.sel-val { font: 600 11px var(--f-mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-caret { color: var(--fg-faint); font-size: 10px; }
.sel.modded { border-color: var(--mod); }
.trow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ------------------------------------------------------------------ TIME */
.routing { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.routing .lbl { font: 600 10.5px var(--f-mono); color: var(--fg-dim); letter-spacing: 0.08em; }
.engines { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.viz { width: 100%; height: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); display: block; }
.hero-row { display: flex; gap: 10px; align-items: flex-start; }
.hero-row > .kgrid { flex: 1; min-width: 0; }
.hero-stack { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.zone { font: 700 13px var(--f-display); letter-spacing: 0.1em; color: var(--accent); }
.panel.bent .panel-title { color: var(--c-glitch); }

/* -------------------------------------------------------------------- FX */
.fx-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; }
.fx-lib { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 150px); overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.fx-lib-head { display: flex; align-items: baseline; justify-content: space-between; }
.fx-cat { border-top: 1px solid var(--line); padding-top: 4px; }
.fx-cat summary { cursor: pointer; display: flex; align-items: center; gap: 6px; font: 600 11px var(--f-mono); letter-spacing: 0.06em; color: var(--fg-dim); padding: 4px 0; list-style: none; }
.fx-cat summary::-webkit-details-marker { display: none; }
.fx-cat summary .muted { margin-left: auto; }
.cat-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cat); }
.fx-lib-item { display: grid; grid-template-columns: 1fr auto; width: 100%; text-align: left; border: 0; background: none; padding: 5px 6px; border-radius: var(--r); cursor: pointer; gap: 0 6px; }
.fx-lib-item:hover { background: var(--panel-2); }
.fx-lib-name { font: 700 14px var(--f-display); letter-spacing: 0.06em; }
.fx-lib-desc { grid-column: 1 / -1; font-size: 11px; color: var(--fg-faint); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fx-lib-item.in .fx-lib-name { color: var(--cat); }
.fx-lib-item.in .fx-lib-name::after { content: " ●"; font-size: 9px; vertical-align: middle; }
.fx-lib-item .lat { grid-row: 1; grid-column: 2; justify-self: end; }
.lat { font: 600 9px var(--f-mono); color: var(--c-spectral); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; align-self: center; }
.fx-main { min-width: 0; }
.fx-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.fx-empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 28px; text-align: center; color: var(--fg-dim); }
.fx-chain { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-items: start; min-height: 60px; }
.fx-chain.drop-end::after { content: ""; display: block; height: 3px; background: var(--accent); grid-column: 1 / -1; }
.fx-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; position: relative; }
.fx-card.drop-before { box-shadow: -4px 0 0 var(--accent); }
.fx-card.dragging { opacity: 0.4; }
.fx-head { display: flex; align-items: center; gap: 7px; padding: 8px 8px 6px 6px; border-bottom: 1px solid var(--line); cursor: grab; min-width: 0; }
.drag-handle { color: var(--fg-faint); font-size: 14px; }
.fx-name { margin: 0; font: 800 18px/1 var(--f-display); letter-spacing: 0.07em; white-space: nowrap; }
.cat-chip { font: 600 9px var(--f-mono); letter-spacing: 0.06em; color: var(--cat); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fx-meter { width: 34px; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.fx-meter i { display: block; height: 100%; width: 100%; background: var(--cat); transform-origin: left; transform: scaleX(0); transition: transform 0.08s linear; }
.fx-meter.err { background: var(--warn); }
.fx-desc { margin: 0; padding: 6px 10px 0; font-size: 11.5px; color: var(--fg-faint); }
.fx-body { padding: 8px 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.fx-body > .kgrid { flex: 1; min-width: 0; }
.fx-host { display: flex; flex-direction: column; gap: 8px; padding-left: 8px; border-left: 1px solid var(--line); }
.fx-card.is-off .fx-body, .fx-card.is-off .fx-desc { opacity: 0.5; }
.fx-card .power.on { border-color: var(--cat); }
.fx-card .power.on .power-led { background: var(--cat); box-shadow: 0 0 8px var(--cat); }

/* --------------------------------------------------------------- ANIMATE */
.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.modtop { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.scope { width: 100%; height: 54px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); display: block; }
.graphs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.graph-cv { width: 100%; height: 150px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); display: block; touch-action: none; cursor: crosshair; }
.seqs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.seq-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pat-tabs button.inactive { color: var(--fg-faint); text-decoration: line-through; }
.steps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; height: 120px; touch-action: none; user-select: none; -webkit-user-select: none; }
.step { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; overflow: hidden; }
.step.beat { border-color: var(--line-2); }
.step i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fg-faint); opacity: 0.35; }
.step.on i { background: var(--accent); opacity: 0.85; }
.step span { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font: 500 8.5px var(--f-mono); color: var(--fg-dim); pointer-events: none; }
.step.cur { box-shadow: inset 0 0 0 2px var(--fg); }
.seq-tools { display: flex; gap: 4px; flex-wrap: wrap; }

<script id="dsp-src">// ---- lib.js
// ============================================================================
// DEBACLE — shared DSP library
// Runs inside the AudioWorkletGlobalScope (no DOM, no window). Also loaded by
// tools/test-fx.mjs inside a node vm context. Everything here is a global.
// ============================================================================

const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const dbToGain = (db) => Math.pow(10, db / 20);
const gainToDb = (g) => 20 * Math.log10(Math.max(1e-12, g));
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const ftom = (f) => 69 + 12 * Math.log2(Math.max(1e-6, f) / 440);
const semisToRatio = (s) => Math.pow(2, s / 12);
const isBad = (x) => !(x === x) || x === Infinity || x === -Infinity; // NaN / Inf

// Pade-style tanh approximation, accurate to ~1e-3 and cheap. Hard-limited to ±1.
function fastTanh(x) {
  if (x > 4.97) return 1;
  if (x < -4.97) return -1;
  const x2 = x * x;
  return (x * (135135 + x2 * (17325 + x2 * (378 + x2)))) /
    (135135 + x2 * (62370 + x2 * (3150 + x2 * 28)));
}
// Cubic soft clip, ±1 knee at |x| = 1.5
function softClip(x) {
  if (x > 1.5) return 1;
  if (x < -1.5) return -1;
  return x - (x * x * x) / 6.75;
}
// Hann window value for phase t in [0,1]
const hann = (t) => 0.5 - 0.5 * Math.cos(TAU * t);
// Tukey window, alpha = taper fraction (0 = rect, 1 = hann)
function tukey(t, alpha) {
  if (alpha <= 0) return 1;
  const a2 = alpha / 2;
  if (t < a2) return 0.5 - 0.5 * Math.cos(Math.PI * t / a2);
  if (t > 1 - a2) return 0.5 - 0.5 * Math.cos(Math.PI * (1 - t) / a2);
  return 1;
}

// ---------------------------------------------------------------------------
// Random: xorshift32, deterministic when seeded.
// ---------------------------------------------------------------------------
class Rng {
  constructor(seed = 0x9e3779b9) { this.s = (seed >>> 0) || 1; }
  nextU32() { let x = this.s; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.s = x >>> 0; return this.s; }
  next() { return this.nextU32() / 4294967296; }          // [0,1)
  bi() { return this.next() * 2 - 1; }                    // [-1,1)
  int(n) { return Math.floor(this.next() * n); }          // 0..n-1
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[this.int(arr.length)]; }
  gauss() { // approx normal(0,1)
    return (this.next() + this.next() + this.next() + this.next() - 2) * 1.732;
  }
}

// ---------------------------------------------------------------------------
// Smoothers / followers
// ---------------------------------------------------------------------------
class Smoother { // one-pole parameter smoother
  constructor(sr, ms = 20, v = 0) { this.v = v; this.t = v; this.setTime(sr, ms); }
  setTime(sr, ms) { this.c = 1 - Math.exp(-1 / (Math.max(0.01, ms) * 0.001 * sr)); }
  set(t) { this.t = t; }
  snap(v) { this.v = this.t = v; }
  next() { this.v += (this.t - this.v) * this.c; return this.v; }
}

class EnvFollower { // peak follower with separate attack/release (ms)
  constructor(sr, attMs = 5, relMs = 120) { this.sr = sr; this.env = 0; this.set(attMs, relMs); }
  set(attMs, relMs) {
    this.a = Math.exp(-1 / (Math.max(0.01, attMs) * 0.001 * this.sr));
    this.r = Math.exp(-1 / (Math.max(0.01, relMs) * 0.001 * this.sr));
  }
  process(x) {
    const ax = x < 0 ? -x : x;
    const c = ax > this.env ? this.a : this.r;
    this.env = ax + c * (this.env - ax);
    return this.env;
  }
}

// ---------------------------------------------------------------------------
// Filters
// ---------------------------------------------------------------------------
class OnePole { // TPT one-pole: lp() / hp() outputs
  constructor() { this.s = 0; this.g = 0.5; this.lpv = 0; }
  set(fc, sr) { const g = Math.tan(Math.PI * clamp(fc, 1, sr * 0.49) / sr); this.g = g / (1 + g); }
  lp(x) { const v = (x - this.s) * this.g; const y = v + this.s; this.s = y + v; return y; }
  hp(x) { return x - this.lp(x); }
  reset() { this.s = 0; }
}

class Biquad { // RBJ cookbook, transposed direct form II. Mono.
  constructor() { this.b0 = 1; this.b1 = 0; this.b2 = 0; this.a1 = 0; this.a2 = 0; this.z1 = 0; this.z2 = 0; }
  _set(b0, b1, b2, a0, a1, a2) {
    const ia = 1 / a0; this.b0 = b0 * ia; this.b1 = b1 * ia; this.b2 = b2 * ia; this.a1 = a1 * ia; this.a2 = a2 * ia;
  }
  _w(f, sr) { const w = TAU * clamp(f, 5, sr * 0.49) / sr; return [Math.cos(w), Math.sin(w)]; }
  lp(f, q, sr) { const [c, s] = this._w(f, sr), al = s / (2 * q); this._set((1 - c) / 2, 1 - c, (1 - c) / 2, 1 + al, -2 * c, 1 - al); return this; }
  hp(f, q, sr) { const [c, s] = this._w(f, sr), al = s / (2 * q); this._set((1 + c) / 2, -(1 + c), (1 + c) / 2, 1 + al, -2 * c, 1 - al); return this; }
  bp(f, q, sr) { const [c, s] = this._w(f, sr), al = s / (2 * q); this._set(al, 0, -al, 1 + al, -2 * c, 1 - al); return this; } // 0 dB peak
  notch(f, q, sr) { const [c, s] = this._w(f, sr), al = s / (2 * q); this._set(1, -2 * c, 1, 1 + al, -2 * c, 1 - al); return this; }
  ap(f, q, sr) { const [c, s] = this._w(f, sr), al = s / (2 * q); this._set(1 - al, -2 * c, 1 + al, 1 + al, -2 * c, 1 - al); return this; }
  peak(f, q, db, sr) {
    const [c, s] = this._w(f, sr), A = Math.pow(10, db / 40), al = s / (2 * q);
    this._set(1 + al * A, -2 * c, 1 - al * A, 1 + al / A, -2 * c, 1 - al / A); return this;
  }
  lowShelf(f, db, sr, slope = 1) {
    const [c, s] = this._w(f, sr), A = Math.pow(10, db / 40);
    const al = s / 2 * Math.sqrt((A + 1 / A) * (1 / slope - 1) + 2), sa = 2 * Math.sqrt(A) * al;
    this._set(A * ((A + 1) - (A - 1) * c + sa), 2 * A * ((A - 1) - (A + 1) * c), A * ((A + 1) - (A - 1) * c - sa),
      (A + 1) + (A - 1) * c + sa, -2 * ((A - 1) + (A + 1) * c), (A + 1) + (A - 1) * c - sa); return this;
  }
  highShelf(f, db, sr, slope = 1) {
    const [c, s] = this._w(f, sr), A = Math.pow(10, db / 40);
    const al = s / 2 * Math.sqrt((A + 1 / A) * (1 / slope - 1) + 2), sa = 2 * Math.sqrt(A) * al;
    this._set(A * ((A + 1) + (A - 1) * c + sa), -2 * A * ((A - 1) + (A + 1) * c), A * ((A + 1) + (A - 1) * c - sa),
      (A + 1) - (A - 1) * c + sa, 2 * ((A - 1) - (A + 1) * c), (A + 1) - (A - 1) * c - sa); return this;
  }
  process(x) {
    const y = this.b0 * x + this.z1;
    this.z1 = this.b1 * x - this.a1 * y + this.z2;
    this.z2 = this.b2 * x - this.a2 * y;
    return y;
  }
  reset() { this.z1 = this.z2 = 0; }
}

// Zero-delay-feedback state variable filter (Simper/Cytomic). After process():
// this.lp, this.bp, this.hp, this.notch, this.peak hold the outputs.
// Stable under fast modulation — prefer this for anything swept.
class SVF {
  constructor() { this.ic1 = 0; this.ic2 = 0; this.lp = this.bp = this.hp = this.notch = this.peak = 0; this.set(1000, 0.707, 48000); }
  set(fc, q, sr) {
    this.g = Math.tan(Math.PI * clamp(fc, 5, sr * 0.48) / sr);
    this.k = 1 / Math.max(0.05, q);
    this.a1 = 1 / (1 + this.g * (this.g + this.k)); this.a2 = this.g * this.a1; this.a3 = this.g * this.a2;
  }
  process(x) {
    const v3 = x - this.ic2;
    const v1 = this.a1 * this.ic1 + this.a2 * v3;
    const v2 = this.ic2 + this.a2 * this.ic1 + this.a3 * v3;
    this.ic1 = 2 * v1 - this.ic1; this.ic2 = 2 * v2 - this.ic2;

// ---------------------------------------------------------------------------
// Ring buffer / delay line (power-of-two size). read(d) = sample written d
// samples ago (fractional, 4-point hermite). d >= 1 recommended.
// ---------------------------------------------------------------------------
function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

  constructor(maxSamples) {
    this.size = nextPow2(Math.max(4, Math.ceil(maxSamples) + 4));
    this.mask = this.size - 1; this.buf = new Float32Array(this.size); this.w = 0;
  }
  write(x) { this.buf[this.w] = x; this.w = (this.w + 1) & this.mask; }
  // delay in samples (fractional); clamps to buffer
  read(d) {
    d = clamp(d, 0, this.size - 4);
    const pos = this.w - 1 - d;
    return this.readAt(pos);
  }
  readLinear(d) {
    d = clamp(d, 0, this.size - 2);
    const pos = this.w - 1 - d, i = Math.floor(pos), f = pos - i, m = this.mask, b = this.buf;
    return b[i & m] + (b[(i + 1) & m] - b[i & m]) * f;
  }
  // absolute (wrapping) fractional index read, hermite
  readAt(pos) {

    const xm1 = b[(i - 1) & m], x0 = b[i & m], x1 = b[(i + 1) & m], x2 = b[(i + 2) & m];

  constructor(maxSamples) { this.dl = new DelayLine(maxSamples); this.d = maxSamples; this.g = 0.5; }
  process(x, d = this.d, g = this.g) {
    const v = this.dl.readLinear(d);

// ---------------------------------------------------------------------------
// FFT (radix-2, in place, complex). N power of two.
// ---------------------------------------------------------------------------
class FFT {
  constructor(n) {
    this.n = n; this.levels = Math.log2(n) | 0;
    this.cos = new Float32Array(n / 2); this.sin = new Float32Array(n / 2);
    for (let i = 0; i < n / 2; i++) { this.cos[i] = Math.cos(TAU * i / n); this.sin[i] = Math.sin(TAU * i / n); }
    this.rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) { let r = 0, x = i; for (let j = 0; j < this.levels; j++) { r = (r << 1) | (x & 1); x >>>= 1; } this.rev[i] = r; }
  }
  _transform(re, im, inv) {
    const n = this.n, rev = this.rev;
    for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    const cs = this.cos, sn = this.sin, sgn = inv ? 1 : -1;
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >>> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = i, k = 0; j < i + half; j++, k += step) {
          const l = j + half;
          const wr = cs[k], wi = sgn * sn[k];
          const xr = re[l] * wr - im[l] * wi, xi = re[l] * wi + im[l] * wr;
          re[l] = re[j] - xr; im[l] = im[j] - xi; re[j] += xr; im[j] += xi;
        }
      }
    }
  }
  forward(re, im) { this._transform(re, im, false); }
  // inverse includes 1/N scaling
  inverse(re, im) { this._transform(re, im, true); const s = 1 / this.n; for (let i = 0; i < this.n; i++) { re[i] *= s; im[i] *= s; } }
}

// ---------------------------------------------------------------------------
// STFT framework (stereo, overlap-add, hann analysis + synthesis windows).
//   const stft = new STFT(2048, 4);
//   stft.process(L, R, n, (re, im, ch, N) => { ...modify bins 0..N/2... });
// The callback edits bins k = 0..N/2 (inclusive) of re/im; negative
// frequencies are rebuilt automatically (conjugate symmetry). Output is
// delayed by stft.latency = N samples. Processing is in place.
// ---------------------------------------------------------------------------
class STFT {
  constructor(size = 2048, overlap = 4) {
    this.N = size; this.hop = size / overlap; this.latency = size; this._lat = size - this.hop;
    this.fft = new FFT(size);
    this.win = new Float32Array(size);
    for (let i = 0; i < size; i++) this.win[i] = hann(i / size);
    // normalisation for analysis*synthesis hann^2 at this overlap
    let acc = 0; for (let i = 0; i < size; i++) acc += this.win[i] * this.win[i];
    this.norm = this.hop / acc;
    this.inF = [new Float32Array(size), new Float32Array(size)];
    this.outF = [new Float32Array(size), new Float32Array(size)];
    this.acc = [new Float32Array(size * 2), new Float32Array(size * 2)];
    this.re = new Float32Array(size); this.im = new Float32Array(size);
    this.rover = this._lat;
    this.frameCount = 0;
  }
  reset() {
    for (let c = 0; c < 2; c++) { this.inF[c].fill(0); this.outF[c].fill(0); this.acc[c].fill(0); }
    this.rover = this._lat; this.frameCount = 0;
  }
  process(L, R, n, frame) {
    const N = this.N, lat = this._lat, chans = [L, R];
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < 2; c++) {
        this.inF[c][this.rover] = chans[c][i];
        chans[c][i] = this.outF[c][this.rover - lat];
      }
      this.rover++;
      if (this.rover >= N) {
        this.rover = lat;
        for (let c = 0; c < 2; c++) this._frame(c, frame);
        this.frameCount++;
      }
    }
  }
  _frame(c, frame) {
    const N = this.N, hop = this.hop, re = this.re, im = this.im, w = this.win, inF = this.inF[c], acc = this.acc[c], outF = this.outF[c];
    for (let k = 0; k < N; k++) { re[k] = inF[k] * w[k]; im[k] = 0; }
    this.fft.forward(re, im);
    frame(re, im, c, N);
    im[0] = 0; im[N / 2] = 0;
    for (let k = 1; k < N / 2; k++) { re[N - k] = re[k]; im[N - k] = -im[k]; }
    this.fft.inverse(re, im);
    const g = this.norm;
    for (let k = 0; k < N; k++) acc[k] += re[k] * w[k] * g;
    for (let k = 0; k < hop; k++) outF[k] = acc[k];
    acc.copyWithin(0, hop, N * 2); acc.fill(0, N * 2 - hop);
    inF.copyWithin(0, hop, N);
  }
}

const DIV_TABLE = [

  ['1/4D', 1.5], ['1/4', 1], ['1/4T', 2 / 3], ['1/8D', 0.75], ['1/8', 0.5], ['1/8T', 1 / 3],
  ['1/16D', 0.375], ['1/16', 0.25], ['1/16T', 1 / 6], ['1/32', 0.125], ['1/32T', 1 / 12],
  ['1/64', 1 / 16], ['1/128', 1 / 32], ['1/256', 1 / 64], ['1/512', 1 / 128],
];

  const a = DIV_TABLE.findIndex((d) => d[0] === from), b = DIV_TABLE.findIndex((d) => d[0] === to);

  constructor() { this.set(0, 'MINOR', 0, 0); }
  set(root, scaleName, chordDeg, chordSize) {
    this.root = root | 0; this.scaleName = scaleName; this.intervals = SCALES[scaleName] || SCALES.MINOR;
    this.chordDeg = chordDeg | 0; this.chordSize = chordSize | 0;
    // full table of in-scale midi notes 0..127
    this.notes = [];
    for (let m = 0; m < 128; m++) if (this.intervals.includes(((m - this.root) % 12 + 12) % 12)) this.notes.push(m);
    // chord as scale-degree stacking
    const degs = this.chordSize === 1 ? [0, 2, 4, 6] : this.chordSize === 2 ? [0, 3, 4] : this.chordSize === 3 ? [0, 4, 7] : [0, 2, 4];

    for (let i = 0; i < notes.length; i++) { const d = Math.abs(notes[i] - m); if (d < bd) { bd = d; best = notes[i]; } }

// ---- params.js
// ============================================================================
// Parameter descriptors: normalized (0..1) <-> real value mapping.
// Shared by the worklet, the UI (main thread) and the test tool.
//
// Descriptor forms:
//   { id, label, min, max, def, unit?, curve?: 'lin'|'exp'|'sq'|'int', bipolar? }
//   { id, label, options: ['A','B',...], def: 0 | 'A' }        -> value = index
//   { id, label, toggle: true, def: 0|1 }                       -> value = 0/1
//   { id, label, div: ['1/1','1/64'], def: '1/8' }              -> value = beats
// ============================================================================

function prepParam(d) {
  if (d._prepped) return d;
  if (d.toggle) { d.kind = 'toggle'; d.options = d.options || ['OFF', 'ON']; }
  else if (d.div) { d.kind = 'div'; d.options = divRange(d.div[0], d.div[1], !!d.straight); }
  else if (d.options) d.kind = 'enum';
  else d.kind = 'num';
  if (d.kind === 'num') {
    if (d.min === undefined) d.min = 0;
    if (d.max === undefined) d.max = 1;
    if (d.def === undefined) d.def = d.min;
    d.curve = d.curve || 'lin';
    if (d.curve === 'exp' && d.min <= 0) d.curve = 'sq';
    d.defN = valueToNorm(d, d.def);
  } else {
    let di = typeof d.def === 'string' ? d.options.indexOf(d.def) : (d.def | 0);
    if (di < 0) di = 0;
    d.defIndex = di;
    d.defN = d.options.length > 1 ? di / (d.options.length - 1) : 0;
  }
  d._prepped = true;
  return d;
}

function normToIndex(d, n) { return Math.round(clamp(n, 0, 1) * (d.options.length - 1)); }

function normToValue(d, n) {
  n = clamp(n, 0, 1);
  switch (d.kind) {
    case 'toggle': return n >= 0.5 ? 1 : 0;
    case 'enum': return normToIndex(d, n);
    case 'div': return DIV_BEATS[d.options[normToIndex(d, n)]];
    default:
      switch (d.curve) {
        case 'exp': return d.min * Math.pow(d.max / d.min, n);
        case 'sq': return d.min + (d.max - d.min) * n * n;
        case 'int': return Math.round(d.min + (d.max - d.min) * n);
        default: return d.min + (d.max - d.min) * n;
      }
  }
}

function valueToNorm(d, v) {
  switch (d.kind) {
    case 'toggle': return v ? 1 : 0;
    case 'enum': case 'div': {
      let i = typeof v === 'string' ? d.options.indexOf(v) : v;
      if (d.kind === 'div' && typeof v === 'number') { i = d.options.findIndex((o) => Math.abs(DIV_BEATS[o] - v) < 1e-9); }
      return d.options.length > 1 ? clamp(i, 0, d.options.length - 1) / (d.options.length - 1) : 0;
    }
    default:
      switch (d.curve) {
        case 'exp': return clamp(Math.log(v / d.min) / Math.log(d.max / d.min), 0, 1);
        case 'sq': return clamp(Math.sqrt(Math.max(0, (v - d.min) / (d.max - d.min))), 0, 1);
        default: return clamp((v - d.min) / (d.max - d.min), 0, 1);
      }
  }
}

function formatValue(d, n) {
  if (d.kind === 'toggle' || d.kind === 'enum' || d.kind === 'div') return d.options[normToIndex(d, n)];
  const v = normToValue(d, n);
  if (d.fmt) return d.fmt(v);
  const u = d.unit || '';
  const a = Math.abs(v);
  let s;
  if (u === 'Hz' && a >= 1000) return (v / 1000).toFixed(a >= 10000 ? 1 : 2) + ' kHz';
  if (u === 'ms' && a >= 1000) return (v / 1000).toFixed(2) + ' s';
  if (d.curve === 'int' || Number.isInteger(d.step)) s = String(Math.round(v));
  else if (a >= 100) s = v.toFixed(0);
  else if (a >= 10) s = v.toFixed(1);
  else s = v.toFixed(2);
  if (d.bipolar && v > 0) s = '+' + s;
  return u ? s + (u === '%' || u === '°' || u === '×' ? '' : ' ') + u : s;
}

// Default graph curves (points: x 0..1, y 0..1, c = curvature of the segment to the next point, -1..1)
const DEFAULT_GRAPHS = [
  [{ x: 0, y: 0, c: 0.5 }, { x: 0.5, y: 1, c: -0.5 }],
  [{ x: 0, y: 1, c: 0.7 }, { x: 0.25, y: 0, c: 0 }, { x: 0.5, y: 0.7, c: 0.7 }, { x: 0.75, y: 0.1, c: 0 }],
  [{ x: 0, y: 0, c: 0 }, { x: 0.125, y: 0.85, c: 0.6 }, { x: 0.375, y: 0.3, c: -0.3 }, { x: 0.5, y: 1, c: 0.6 }, { x: 0.8, y: 0.15, c: 0 }],
];
function evalGraph(points, x) {
  // closed curve over [0,1)
  const n = points.length;
  if (!n) return 0;
  x = x - Math.floor(x);
  let i = n - 1;
  for (let k = 0; k < n; k++) { if (points[k].x <= x) i = k; else break; }
  if (x < points[0].x) i = n - 1;
  const a = points[i], b = points[(i + 1) % n];
  let x0 = a.x, x1 = b.x; let xx = x;
  if (i === n - 1) { x1 = b.x + 1; if (xx < x0) xx += 1; }
  const span = x1 - x0;
  let t = span > 1e-9 ? (xx - x0) / span : 0;
  t = clamp(t, 0, 1);
  const c = a.c || 0;
  // curvature via power curve: c>0 bows toward start value ("fast"), c<0 slow
  const e = Math.pow(2, -c * 3);
  t = Math.pow(t, e);
  return a.y + (b.y - a.y) * t;
}

// Default 16-step sequencer patterns (4 patterns each); step = {on, v (0..1)}
function defaultSeq(kind) {
  const pats = [];
  for (let p = 0; p < 4; p++) {
    const steps = [];
    for (let s = 0; s < 16; s++) {
      if (kind === 'stutter') steps.push({ on: [0, 3, 6, 8, 10, 12, 14].includes(s) ? 1 : 0, v: [0.55, 0.7, 0.4, 0.85][(s + p) % 4] });
      else steps.push({ on: 1, v: [0.5, 0.25, 1, 0.0, 0.5, 0.75, 0.1, 1][s % 8] });
    }
    pats.push(steps);
  }
  return pats;
}

// Stereo ring buffer addressed by absolute sample index.

}

// STRETCH — dual-grain stretcher / freezer
// ---------------------------------------------------------------------------
class Stretch {
  constructor(sr) {
    this.sr = sr;
    this.ring = new TE_Ring(Math.ceil(sr * 12));
    this.tmp = new Float32Array(2);
    this.fader = new TE_Fader(sr);
    this.rng = new Rng(0xBEEF);
    this.MAXG = 8;
    this.grains = [];
    for (let i = 0; i < this.MAXG; i++) this.grains.push({ on: false, pos: 0, rate: 1, t: 0, dur: 1, gl: 1, gr: 1 });
    this.reset();
  }
  reset() {
    this.ring.clear(); this.ring.w = 0;
    for (const g of this.grains) g.on = false;
    this.chunk = null; this.chunkStart = 0; this.readPos = 0; this.gIdx = null; this.gCount = 0; this.gTimer = 0;
    this.wasOn = false; this.seqStep = -1; this.seqIdx = 0; this.seqOn = true; this.seqSpeed = 0.5; this.dry = 1;
    this.state = { pos: 0, speed: 0 };
  }
  _spawn(p, G, ratio, rev, spread) {
    let g = null;
    for (let i = 0; i < this.MAXG; i++) if (!this.grains[i].on) { g = this.grains[i]; break; }
    if (!g) { // steal the oldest
      g = this.grains[0]; for (let i = 1; i < this.MAXG; i++) if (this.grains[i].t > g.t) g = this.grains[i];
    }
    const dur = 2 * G;
    const span = dur * ratio;
    const chunkLen = this.chunkLen;
    let start = this.chunkStart + this.readPos;
    if (p.scatter > 0) start -= this.rng.next() * (p.scatter / 100) * chunkLen * 0.75;
    // read a grain's worth behind so forward grains never reach the write head
    start -= span + 4;
    g.on = true; g.t = 0; g.dur = dur; g.rate = rev ? -ratio : ratio; g.pos = rev ? start + span : start;
    const side = (this.gCount++ & 1) ? 1 : -1;
    const pan = side * spread, th = (pan + 1) * Math.PI / 4;
    g.gl = Math.min(1, Math.cos(th) * Math.SQRT2); g.gr = Math.min(1, Math.sin(th) * Math.SQRT2);
  }
  process(L, R, n, p, seq, ctx) {
    const on = p.on >= 0.5;
    const ring = this.ring;
    if (!on && this.fader.v === 0) { for (let i = 0; i < n; i++) ring.push(L[i], R[i]); this.wasOn = false; return; }
    let justOn = on && !this.wasOn; this.wasOn = on;

    const tempoBeats = p.tempo;

    let speed = p.speed / 100;
    const sync = p.sync >= 0.5;

    let ratio = semisToRatio(p.pitch);
    const rev = p.rev >= 0.5, freeze = p.freeze >= 0.5, spread = p.spread / 100;
    const dryStep = 1 / (0.008 * sr);
    for (let i = 0; i < n; i++) {
      const dl = L[i], dr = R[i];
      if (!freeze || this.chunk === null) ring.push(dl, dr); // FREEZE stops capture
      const now = ring.w - 1;
      const beat = ctx.ppq + i / spb;
      // sequencer: SPEED per step, off-step = dry
      if (useSeq) {
        const si = Math.floor(beat / seq.rate);
        if (si !== this.seqStep) {

          const st = seq.pats[Math.floor(idx / 16)][idx % 16]; this.seqOn = !!st.on; this.seqSpeed = st.v;
        }

}

// ============================================================================
// DEBACLE — host engine. Owns transport, source player, parameter banks,
// modulation, time engines, FX chain, MAIN row and limiter.
// DebacleEngine is a plain class so it can run inside an AudioWorklet or, as a
// fallback, inside a ScriptProcessorNode on the main thread.
// ============================================================================

class ParamBank {
  constructor(key, descs) {
    this.key = key; this.d = descs; this.n = descs.length;
    this.base = new Float32Array(this.n); this.eff = new Float32Array(this.n);
    this.mod = new Uint8Array(this.n);
    this.idx = {}; this.v = {};
    descs.forEach((d, i) => { prepParam(d); this.idx[d.id] = i; this.base[i] = this.eff[i] = d.defN; this.v[d.id] = normToValue(d, d.defN); });
  }
  setBase(i, n) {
    this.base[i] = n;
    if (!this.mod[i]) { this.eff[i] = n; this.v[this.d[i].id] = normToValue(this.d[i], n); }
  }
  setEff(i, n) { this.eff[i] = n; this.v[this.d[i].id] = normToValue(this.d[i], n); }
}

const HOST_FX_PARAMS = () => [
  { id: 'on', label: 'ON', toggle: true, def: 0 },
  { id: 'mix', label: 'MIX', min: 0, max: 100, def: 100, unit: '%' },
  { id: 'gain', label: 'GAIN', min: -12, max: 12, def: 0, unit: 'dB', bipolar: true },
];

class FxSlot {
  constructor(cls, sr) {
    this.cls = cls; this.id = cls.id; this.sr = sr;
    this.bank = new ParamBank('fx.' + cls.id, HOST_FX_PARAMS().concat(cls.params.map((d) => Object.assign({}, d))));
    this.inst = null; this.fade = 0; this.wasOn = false; this.latency = cls.latency || 0;
    this.dryL = new Float32Array(128); this.dryR = new Float32Array(128);
    this.dly = null; this.level = 0; this.inChain = false;
    this.gain = 1;
  }
  ensure() {
    if (!this.inst) this.inst = new this.cls(this.sr);
    if (this.latency > 0 && !this.dly) { this.dly = [new DelayLine(this.latency + 8), new DelayLine(this.latency + 8)]; }
  }
}

class DebacleEngine {
  constructor(sr, post) {
    this.sr = sr; this.post = post;
    this.ctx = { sr, bpm: 120, spb: sr * 0.5, ppq: 0, playing: false, time: 0, blockSize: 128, key: new KeyHelper(), sidechain: null };
    // banks
    this.banks = {};
    for (const [k, u] of Object.entries(UNITS)) this.banks[k] = new ParamBank(k, u.params);
    this.fx = {};
    for (const cls of FX_REGISTRY) { const s = new FxSlot(cls, sr); this.fx[cls.id] = s; this.banks['fx.' + cls.id] = s.bank; }
    this.chain = [];   // ordered FxSlots
    // engines
    this.vari = new Varispeed(sr); this.stutter = new Stutter(sr); this.stretch = new Stretch(sr);
    this.seqs = { stutter: { pats: defaultSeq('stutter'), rate: 0.25, chain: 1 }, stretch: { pats: defaultSeq('stretch'), rate: 0.5, chain: 1 } };
    // modulation
    this.slots = []; this.targets = []; this.srcVal = new Float32Array(MOD_SOURCE_IDS.length);
    this.graphs = DEFAULT_GRAPHS.map((g) => g.map((p) => Object.assign({}, p)));
    this.lfo = [0, 1, 2, 3].map((i) => ({ phase: 0, out: 0.5, sm: 0.5, last: -1, env: 0, rnd: new Rng(1234 + i * 77), lp: new OnePole(), hp: new OnePole(), cyc: -1, jit: 0, amp: 1 }));
    // source
    this.src = null; this.srcPos = 0; this.srcMode = 0; this.srcGain = 1; this.inGain = 1;
    this.playing = false; this.playSamples = 0; this.freeSamples = 0;
    // buffers
    this.bL = new Float32Array(128); this.bR = new Float32Array(128);
    this.dL = new Float32Array(128); this.dR = new Float32Array(128);      // dry (source) copy
    this.eL = new Float32Array(128); this.eR = new Float32Array(128);      // post-engine copy (env follower INTERNAL)
    this.pL = [new Float32Array(128), new Float32Array(128), new Float32Array(128)];
    this.pR = [new Float32Array(128), new Float32Array(128), new Float32Array(128)];
    this.aL = new Float32Array(128); this.aR = new Float32Array(128);
    this.seam = new Uint8Array(128);
    // main
    this.eq = [0, 1].map(() => [new Biquad(), new Biquad(), new Biquad()]);
    this.eqSig = '';
    this.mainDly = [new DelayLine(sr * 0.25), new DelayLine(sr * 0.25)];
    this.gainS = new Smoother(sr, 30, 1); this.panS = new Smoother(sr, 30, 0); this.mixS = new Smoother(sr, 30, 1); this.byS = new Smoother(sr, 10, 0);
    this.compEnv = 0; this.rmsIn = 1e-4; this.rmsOut = 1e-4; this.autoG = 1;
    this.limEnv = 0; this.gr = 0;
    this.engFade = { stretch: 0, vari: 0, stutter: 0 };
    // telemetry
    this.tick = 0; this.tickN = Math.floor(sr / 30);
    this.peaks = new Float32Array(4);
    this.print = null;
    this.keySig = '';
  }

  // ------------------------------------------------------------------ messages
  handle(m) {
    switch (m.type) {
      case 'param': this.setParam(m.k, m.n); break;
      case 'params': for (const [k, n] of m.list) this.setParam(k, n); break;
      case 'chain': this.setChain(m.ids); break;
      case 'slots': this.setSlots(m.slots); break;
      case 'graph': this.graphs[m.i] = m.points.map((p) => ({ x: p.x, y: p.y, c: p.c || 0 })).sort((a, b) => a.x - b.x); break;
      case 'seq': this.seqs[m.which].pats = m.pats; break;
      case 'source': this.setSource(m.L, m.R || m.L); break;
      case 'srcmode': this.srcMode = m.mode; break;
      case 'srcgain': this.srcGain = m.g; break;
      case 'bpm': this.setBpm(m.bpm); break;
      case 'play': this.setPlay(m.on); break;
      case 'print': this.startPrint(m.len); break;
      case 'resetfx': { const s = this.fx[m.id]; if (s && s.inst) s.inst.reset(); break; }
    }
  }
  setSource(L, R) {
    // loops that do not wrap smoothly get a 1.5 ms fade at the seam (length stays exact)
    const len = L.length, jump = Math.abs(L[len - 1] - L[0]) + Math.abs(R[len - 1] - R[0]);
    if (jump > 0.004 && len > 1024) {
      const f = Math.max(16, Math.round(this.sr * 0.0015));
      for (let i = 0; i < f; i++) { const g = i / f; L[i] *= g; L[len - 1 - i] *= g; if (R !== L) { R[i] *= g; R[len - 1 - i] *= g; } }
    }
    this.src = { L, R, len };
    this.srcPos = this.playing ? this.srcPos % len : 0;
  }
  setBpm(b) { this.ctx.bpm = clamp(b, 30, 300); this.ctx.spb = this.sr * 60 / this.ctx.bpm; }
  setPlay(on) {
    this.playing = !!on;
    if (on) { this.playSamples = 0; this.srcPos = 0; this.rearm(); }
  }
  rearm() {
    const st = this.stutter; st.cycle = null; st.seqStep = -1; st.b.cycle = null; st.b.captured = false; st.histW = st.ring.w;
    const sh = this.stretch; sh.chunk = null; sh.gIdx = null; sh.seqStep = -1;
    this.vari.win = -1;
  }
  setParam(k, n) {
    const dot = k.lastIndexOf('.');
    const bank = this.banks[k.slice(0, dot)];
    if (!bank) return;
    const i = bank.idx[k.slice(dot + 1)];
    if (i === undefined) return;
    bank.setBase(i, clamp(+n, 0, 1));
  }
  setChain(ids) {
    for (const s of this.chain) s.inChain = false;
    this.chain = ids.map((id) => this.fx[id]).filter(Boolean);
    for (const s of this.chain) { s.inChain = true; }
  }
  setSlots(slots) {
    // restore previously modulated params
    for (const t of this.targets) { t.bank.mod[t.i] = 0; t.bank.setBase(t.i, t.bank.base[t.i]); }
    this.slots = slots;
    const map = new Map();
    for (const s of slots) {
      const dot = s.target.lastIndexOf('.');
      const bank = this.banks[s.target.slice(0, dot)];
      if (!bank) continue;
      const i = bank.idx[s.target.slice(dot + 1)];
      const si = MOD_SOURCE_IDS.indexOf(s.src);
      if (i === undefined || si < 0) continue;
      let t = map.get(s.target);
      if (!t) { t = { key: s.target, bank, i, slots: [] }; map.set(s.target, t); }
      t.slots.push({ si, min: s.min, max: s.max, start: s.start ?? 0, end: s.end ?? 1, skew: s.skew || 0, shape: s.shape | 0 });
    }
    this.targets = [...map.values()];
    for (const t of this.targets) t.bank.mod[t.i] = 1;
  }
  startPrint(len) {
    const n = Math.min(Math.floor(len), this.sr * 32);
    this.print = { L: new Float32Array(n), R: new Float32Array(n), pos: 0, armed: true };
  }

  // ---------------------------------------------------------------- modulation
  static slotMap(s, sl) {
    let t;
    const span = sl.end - sl.start;
    if (Math.abs(span) < 1e-6) t = s >= sl.start ? 1 : 0; else t = clamp((s - sl.start) / span, 0, 1);
    if (sl.shape === 1) t = t < 0.5 ? t * 2 : 2 - t * 2;
    else if (sl.shape === 2) t = t * t * (3 - 2 * t);
    if (sl.skew) t = Math.pow(t, Math.pow(4, -sl.skew));
    return sl.min + (sl.max - sl.min) * t;
  }
  lfoShape(shape, ph) {
    switch (shape) {
      case 0: return 0.5 - 0.5 * Math.cos(TAU * ph);                    // sine (starts at 0)
      case 1: return ph < 0.5 ? ph * 2 : 2 - ph * 2;                     // triangle
      case 2: return ph;                                                 // saw up
      case 3: return 1 - ph;                                             // saw down
      case 4: return ph < 0.5 ? 1 : 0;                                   // square
      case 5: return ph < 0.25 ? 1 : 0;                                  // pulse 25
      case 6: return ph < 0.1 ? 1 : 0;                                   // pulse 10
      case 7: return (Math.exp(ph * 4) - 1) / (Math.exp(4) - 1);         // exp
      case 8: return Math.log1p(ph * 20) / Math.log(21);                 // log
      case 9: return Math.pow(1 - Math.abs(ph * 2 - 1), 3);               // peak
      case 10: return 1 - Math.pow(1 - Math.abs(ph * 2 - 1), 3);          // valley
      case 11: return Math.sin(Math.PI * ph);                            // bump
      case 12: { const q = (ph * 2) % 1; return 0.5 - 0.5 * Math.cos(TAU * q); } // double
      case 13: return ph < 0.2 ? ph / 0.2 : 1 - (ph - 0.2) / 0.8;         // skew
      case 14: return Math.floor(ph * 4) / 3;                            // stairs 4
      case 15: return Math.floor(ph * 8) / 7;                            // stairs 8
      case 16: return Math.abs(Math.sin(Math.PI * 2 * ph)) ;             // half sine (rectified)
      case 17: { const q = ph < 0.5 ? ph * 2 : (ph - 0.5) * 2; return Math.abs(Math.cos(Math.PI * q * 0.5)) * (ph < 0.5 ? 1 : 0.55); } // bounce
      case 18: return clamp(ph < 0.5 ? ph * 4 : (1 - ph) * 4, 0, 1);     // trapezoid
      default: return 0.5;
    }
  }
  hash(k, seed) { let x = (k * 374761393 + seed * 668265263) | 0; x = (x ^ (x >>> 13)) * 1274126177 | 0; x ^= x >>> 16; return (x >>> 0) / 4294967296; }

  updateSources(n) {
    const ctx = this.ctx, sr = this.sr;
    const ppq = ctx.ppq;
    for (let i = 0; i < 4; i++) {
      const v = this.banks['lfo' + (i + 1)].v, st = this.lfo[i];
      let out;
      if (v.mode === 2) { // envelope follower
        const srcL = v.esrc === 1 ? this.dL : this.eL, srcR = v.esrc === 1 ? this.dR : this.eR;
        const tone = v.tone / 100;
        st.lp.set(tone < 0 ? 20000 * Math.pow(0.005, -tone) : 20000, sr);
        st.hp.set(tone > 0 ? 20 * Math.pow(250, tone) : 20, sr);
        const a = Math.exp(-1 / (v.rise * 0.001 * sr)), r = Math.exp(-1 / (v.fall * 0.001 * sr));
        const g = dbToGain(v.egain);
        let e = st.env;
        for (let k = 0; k < n; k++) {
          let x = (srcL[k] + srcR[k]) * 0.5;
          x = st.lp.lp(x); x = st.hp.hp(x);
          const ax = Math.abs(x) * g;
          e = ax > e ? ax + a * (e - ax) : ax + r * (e - ax);
        }
        st.env = e; out = clamp(e, 0, 1);
      } else {
        let pos; // position in cycles
        if (v.free >= 0.5) { st.phase += v.hz * n / sr; pos = st.phase; }
        else pos = ppq / v.rate;
        pos += v.phase / 360;
        const jit = v.jitter / 100;
        const cyc = Math.floor(pos);
        if (v.mode === 1) { // random
          const seed = 17 + i * 101;
          let x = pos;
          if (jit > 0) x += (this.hash(cyc, seed + 5) - 0.5) * jit * 0.9;
          const c = Math.floor(x), f = x - c;
          const a = this.hash(c, seed), b = this.hash(c + 1, seed);
          out = v.bin >= 0.5 ? a : a + (b - a) * (0.5 - 0.5 * Math.cos(Math.PI * f));
        } else {
          let ph = pos - cyc;
          if (cyc !== st.cyc) { st.cyc = cyc; st.jit = (this.hash(cyc, 999 + i) - 0.5) * jit * 0.5; st.amp = 1 - jit * this.hash(cyc, 333 + i) * 0.8; }
          ph = ph + st.jit; ph -= Math.floor(ph);
          out = 0.5 + (this.lfoShape(v.shape, ph) - 0.5) * st.amp;
        }
      }
      const sm = v.smooth / 100;
      if (sm > 0.001) {
        const tc = 0.002 + sm * sm * 1.5; // seconds
        const c = 1 - Math.exp(-n / (tc * sr));
        st.sm += (out - st.sm) * c; out = st.sm;
      } else st.sm = out;
      st.out = out;
      this.srcVal[i] = out;
    }
    const speeds = [0.25, 0.5, 1, 2, 4];
    for (let g = 0; g < 3; g++) {
      const v = this.banks['graph' + (g + 1)].v;
      let x = ppq * speeds[v.speed] / v.len;
      if (v.dir === 1) x = 1 - (x - Math.floor(x));
      else if (v.dir === 2) { const q = (x / 2) - Math.floor(x / 2); x = q < 0.5 ? q * 2 : 2 - q * 2; }
      this.srcVal[4 + g] = clamp(evalGraph(this.graphs[g], x), 0, 1);
    }
    const pf = this.banks.perform.eff;
    for (let k = 0; k < 6; k++) this.srcVal[7 + k] = pf[k];
  }
  applyMods() {
    const sv = this.srcVal;
    for (let t = 0; t < this.targets.length; t++) {
      const tg = this.targets[t]; let acc = 0;
      for (let s = 0; s < tg.slots.length; s++) acc += DebacleEngine.slotMap(sv[tg.slots[s].si], tg.slots[s]);
      tg.bank.setEff(tg.i, clamp(acc / tg.slots.length, 0, 1));
    }
  }

  // ------------------------------------------------------------------- render
  process(inL, inR, outL, outR, n) {
    const ctx = this.ctx, sr = this.sr;
    // clock
    if (this.playing) ctx.ppq = this.playSamples / ctx.spb; else ctx.ppq = this.freeSamples / ctx.spb;
    ctx.playing = this.playing; ctx.time += n;
    // key
    const kv = this.banks.key.v;
    const sig = kv.root * 1000 + kv.scale * 100 + kv.chord * 10 + kv.csize;
    if (sig !== this.keySig) { this.keySig = sig; ctx.key.set(kv.root, SCALE_NAMES[kv.scale], kv.chord, kv.csize); }
    // modulation (sources computed from the previous block's signals)
    this.applyMods();
    this.seqs.stutter.rate = this.banks.sseq.v.rate; this.seqs.stutter.chain = this.banks.sseq.v.chain;
    this.seqs.stretch.rate = this.banks.tseq.v.rate; this.seqs.stretch.chain = this.banks.tseq.v.chain;

    // source
    const L = this.bL, R = this.bR;
    const src = this.src;
    for (let i = 0; i < n; i++) {
      let l = 0, r = 0;
      this.seam[i] = 0;
      if (this.playing && src && this.srcMode !== 1) {
        const p = this.srcPos;
        this.seam[i] = p === 0 ? 1 : 0;
        l = src.L[p]; r = src.R[p];
        this.srcPos = p + 1 >= src.len ? 0 : p + 1;
        l *= this.srcGain; r *= this.srcGain;
      }
      if (this.srcMode !== 0 && inL) { l += inL[i] * this.inGain; r += (inR || inL)[i] * this.inGain; }
      L[i] = l; R[i] = r; this.dL[i] = l; this.dR[i] = r;
    }

    // time engines
    const order = this.banks.time.v.order;
    const bs = this.banks.stretch.v, bv = this.banks.vari.v, bt = this.banks.stutter.v, bb = this.banks.bend.v;
    const runStretch = (a, b) => this.stretch.process(a, b, n, bs, this.seqs.stretch, ctx);
    const runVari = (a, b) => this.vari.process(a, b, n, bv, ctx);
    const runStutter = (a, b) => this.stutter.process(a, b, n, bt, bb, this.seqs.stutter, ctx);
    if (order === 3) {
      const runs = [runStretch, runVari, runStutter];
      const ons = [bs.on >= 0.5 || this.stretch.fader.v > 0, bv.on >= 0.5 || this.vari.fader.v > 0, bt.on >= 0.5 || this.stutter.fader.v > 0];
      let cnt = 0; this.aL.fill(0, 0, n); this.aR.fill(0, 0, n);
      for (let e = 0; e < 3; e++) {
        const pl = this.pL[e], pr = this.pR[e];
        pl.set(L.subarray(0, n)); pr.set(R.subarray(0, n));
        runs[e](pl, pr); // always run (keeps buffers recording); off engines return dry
        if (ons[e]) { cnt++; for (let i = 0; i < n; i++) { this.aL[i] += pl[i]; this.aR[i] += pr[i]; } }
      }
      if (cnt) { const g = 1 / cnt; for (let i = 0; i < n; i++) { L[i] = this.aL[i] * g; R[i] = this.aR[i] * g; } }
    } else {
      const seqOrder = order === 0 ? [runStretch, runVari, runStutter] : order === 1 ? [runVari, runStretch, runStutter] : [runStutter, runStretch, runVari];
      for (const f of seqOrder) f(L, R);
    }
    for (let i = 0; i < n; i++) { this.eL[i] = L[i]; this.eR[i] = R[i]; }

    // FX chain
    let latency = 0;
    const parallel = this.banks.chain.v.mode === 1;
    if (parallel) {
      let cnt = 0; this.aL.fill(0, 0, n); this.aR.fill(0, 0, n);
      const pl = this.pL[0], pr = this.pR[0];
      for (const s of this.chain) {
        const v = s.bank.v;
        if (v.on < 0.5 && s.fade === 0) { s.wasOn = false; s.level *= 0.8; continue; }
        pl.set(L.subarray(0, n)); pr.set(R.subarray(0, n));
        this.runFx(s, pl, pr, n);
        cnt++; for (let i = 0; i < n; i++) { this.aL[i] += pl[i]; this.aR[i] += pr[i]; }
        if (s.latency > latency) latency = s.latency;
      }
      if (cnt) { const g = 1 / Math.sqrt(cnt); for (let i = 0; i < n; i++) { L[i] = this.aL[i] * g; R[i] = this.aR[i] * g; } }
    } else {
      for (const s of this.chain) {
        const v = s.bank.v;
        if (v.on < 0.5 && s.fade === 0) { s.wasOn = false; s.level *= 0.8; continue; }
        this.runFx(s, L, R, n);
        latency += s.latency;
      }
    }

    // MAIN
    this.processMain(L, R, n, latency);
    // limiter + output + meters
    let pI0 = this.peaks[0], pI1 = this.peaks[1], pO0 = this.peaks[2], pO1 = this.peaks[3];
    const rel = Math.exp(-1 / (0.08 * sr)), thr = 0.89;
    let grMax = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.abs(this.dL[i]), b = Math.abs(this.dR[i]); if (a > pI0) pI0 = a; if (b > pI1) pI1 = b;
      let l = L[i], r = R[i];
      if (!(l === l) || !(r === r) || Math.abs(l) > 1e6 || Math.abs(r) > 1e6) { l = r = 0; }
      const pk = Math.max(Math.abs(l), Math.abs(r));
      this.limEnv = pk > this.limEnv ? pk : pk + rel * (this.limEnv - pk);
      const g = this.limEnv > thr ? thr / this.limEnv : 1;
      if (1 - g > grMax) grMax = 1 - g;
      l *= g; r *= g;
      l = l > 0.85 ? 0.85 + 0.13 * fastTanh((l - 0.85) / 0.13) : l < -0.85 ? -0.85 + 0.13 * fastTanh((l + 0.85) / 0.13) : l;
      r = r > 0.85 ? 0.85 + 0.13 * fastTanh((r - 0.85) / 0.13) : r < -0.85 ? -0.85 + 0.13 * fastTanh((r + 0.85) / 0.13) : r;
      outL[i] = l; outR[i] = r;
      const al = Math.abs(l), ar = Math.abs(r); if (al > pO0) pO0 = al; if (ar > pO1) pO1 = ar;
    }
    this.peaks[0] = pI0; this.peaks[1] = pI1; this.peaks[2] = pO0; this.peaks[3] = pO1;
    this.gr = Math.max(this.gr, grMax);
    // print (resample output into a new loop, starting at the loop seam)
    if (this.print) {
      const pr = this.print;
      for (let i = 0; i < n && pr.pos < pr.L.length; i++) {
        if (pr.armed) { if (this.seam[i] || !this.src || this.srcMode === 1) pr.armed = false; else continue; }
        pr.L[pr.pos] = outL[i]; pr.R[pr.pos] = outR[i]; pr.pos++;
      }
      if (pr.pos >= pr.L.length) { this.post({ type: 'printed', L: pr.L, R: pr.R }); this.print = null; }
    }

    // sources for next block (env follower needs this block's signals)
    this.updateSources(n);
    // advance clock
    if (this.playing) this.playSamples += n; else this.freeSamples += n;
    // telemetry
    this.tick += n;
    if (this.tick >= this.tickN) { this.tick = 0; this.sendTick(latency); }
  }

  runFx(s, L, R, n) {
    const v = s.bank.v, on = v.on >= 0.5;
    s.ensure();
    if (on && !s.wasOn) { if (s.fade === 0) s.inst.reset(); if (s.dly) { s.dly[0].clear(); s.dly[1].clear(); } }
    s.wasOn = on;
    const dryL = s.dryL, dryR = s.dryR;
    for (let i = 0; i < n; i++) { dryL[i] = L[i]; dryR[i] = R[i]; }
    try { s.inst.process(L, R, n, v, this.ctx); }
    catch (e) { for (let i = 0; i < n; i++) { L[i] = dryL[i]; R[i] = dryR[i]; } s.error = String(e && e.message || e); return; }
    const step = 1 / (0.01 * this.sr) ;
    const mix = v.mix / 100, gT = dbToGain(v.gain);
    let fade = s.fade, bad = false, lev = 0;
    for (let i = 0; i < n; i++) {
      let wl = L[i], wr = R[i];
      if (!(wl === wl) || !(wr === wr) || Math.abs(wl) > 1e4 || Math.abs(wr) > 1e4) { bad = true; break; }
      let dl = dryL[i], dr = dryR[i];
      if (s.dly) { s.dly[0].write(dl); s.dly[1].write(dr); dl = s.dly[0].tap(s.latency); dr = s.dly[1].tap(s.latency); }
      if (on) { fade += step; if (fade > 1) fade = 1; } else { fade -= step; if (fade < 0) fade = 0; }
      s.gain += (gT - s.gain) * 0.002;
      const m = mix * fade;
      wl *= s.gain; wr *= s.gain;
      L[i] = dl + (wl - dl) * m; R[i] = dr + (wr - dr) * m;
      lev += wl * wl + wr * wr;
    }
    if (bad) { // NaN / Inf guard: drop the block, reset the effect
      for (let i = 0; i < n; i++) { L[i] = dryL[i]; R[i] = dryR[i]; }
      s.inst.reset(); return;
    }
    s.fade = fade;
    s.level = Math.max(s.level * 0.9, Math.sqrt(lev / (2 * n)));
  }

  processMain(L, R, n, latency) {
    const v = this.banks.main.v, sr = this.sr;
    const sig = v.low + ',' + v.mid + ',' + v.high;
    if (sig !== this.eqSig) {
      this.eqSig = sig;

// Compact editor row for a modulation slot (MIN/MAX/START/END/SKEW/SHAPE + curve preview)
function SlotRow(slot, opts = {}) {
  const row = h('div', { class: 'slot' });
  const name = h('button', { type: 'button', class: 'slot-name', title: 'Show parameter' }, keyLabel(slot.target));
  name.addEventListener('click', () => revealParam(slot.target));
  const del = h('button', { type: 'button', class: 'icon-btn sm', 'aria-label': 'Remove assignment' }, '×');
  del.addEventListener('click', () => removeSlot(slot));
  const cv = h('canvas', { class: 'slot-curve', width: 72, height: 30, 'aria-hidden': 'true' });

    const c = cv.getContext('2d'), W = cv.width, H = cv.height;

    c.strokeStyle = cssVar(opts.color || '--mod'); c.lineWidth = 1.6; c.beginPath();

      h('span', { class: 'slot-fl' }, label), h('span', { class: 'slot-fv' }));

    f.addEventListener('pointermove', (e) => { if (!dr) return; const dv = ((dr.y - e.clientY) + (e.clientX - dr.x) * 0.5) / (e.shiftKey ? 800 : 160) * (hi - lo); slot[prop] = Math.max(lo, Math.min(hi, dr.v + dv)); upd(); draw(); slotChanged(slot); });

// ============================================================================
// DEBACLE UI — audio: context, worklet (with ScriptProcessor fallback),
// demo loop synthesis, file loading, print/resample.
// ============================================================================

const AUDIO = { ctx: null, node: null, analyser: null, mode: '', micNode: null, started: false, loops: {}, current: null };

const DEMO_LOOPS = [
  { id: 'break', name: 'BREAK', bpm: 96, bars: 2, desc: 'Dusty breakbeat with a round bass' },
  { id: 'keys', name: 'KEYS', bpm: 84, bars: 2, desc: 'Electric piano chords, Am9 → Fmaj7' },
  { id: 'arp', name: 'ARP', bpm: 122, bars: 2, desc: 'Plucked minor arpeggio over a four-to-floor kick' },
  { id: 'choir', name: 'CHOIR', bpm: 70, bars: 2, desc: 'Breathy vowel pad, slowly opening' },
];

async function startAudio() {
  if (AUDIO.started) { if (AUDIO.ctx.state !== 'running') await AUDIO.ctx.resume(); return true; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { toast('This browser has no Web Audio support.'); return false; }
  const ctx = new Ctx({ latencyHint: 'interactive' });
  AUDIO.ctx = ctx;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.75;
  AUDIO.analyser = analyser;
  let ok = false;
  if (ctx.audioWorklet && window.isSecureContext !== false) {
    try {
      const url = URL.createObjectURL(new Blob([DSP_SRC], { type: 'application/javascript' }));
      await ctx.audioWorklet.addModule(url);
      const node = new AudioWorkletNode(ctx, 'debacle', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2], channelCount: 2, channelCountMode: 'explicit' });
      node.port.onmessage = (e) => onEngineMsg(e.data);
      node.onprocessorerror = () => toast('The audio engine stopped after an error. Reload the page to restart it.');
      AUDIO.node = node; AUDIO.mode = 'worklet';
      enginePort = { post: (m, t) => node.port.postMessage(m, t || []) };
      ok = true;
    } catch (err) { console.warn('AudioWorklet unavailable, falling back', err); }
  }
  if (!ok) {
    // Fallback: run the same engine on the main thread
    const node = ctx.createScriptProcessor(1024, 2, 2);
    const eng = new DSP.DebacleEngine(ctx.sampleRate, (m) => queueMicrotask(() => onEngineMsg(m)));
    const bl = [new Float32Array(128), new Float32Array(128)], il = [new Float32Array(128), new Float32Array(128)];
    node.onaudioprocess = (e) => {
      const iL = e.inputBuffer.getChannelData(0), iR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : iL;
      const oL = e.outputBuffer.getChannelData(0), oR = e.outputBuffer.getChannelData(1);
      for (let o = 0; o < oL.length; o += 128) {
        il[0].set(iL.subarray(o, o + 128)); il[1].set(iR.subarray(o, o + 128));
        eng.process(il[0], il[1], bl[0], bl[1], 128);
        oL.set(bl[0], o); oR.set(bl[1], o);
      }
    };
    AUDIO.node = node; AUDIO.mode = 'script';
    enginePort = { post: (m) => eng.handle(m) };
  }
  // keep a silent input connected so the processor always runs
  const silent = ctx.createConstantSource ? ctx.createConstantSource() : null;
  if (silent) { silent.offset.value = 0; silent.connect(AUDIO.node); silent.start(); }
  AUDIO.node.connect(analyser); analyser.connect(ctx.destination);
  AUDIO.started = true;
  sendAll();
  await loadDemo(AUDIO.current || 'break', true);
  post({ type: 'srcmode', mode: AUDIO.srcMode || 0 });
  $('#engine-mode').textContent = AUDIO.mode === 'worklet' ? 'WORKLET' : 'SCRIPT';
  return true;
}

function onEngineMsg(m) {
  if (m.type === 'tick') { live.tick = m; live.src = m.src; live.mods = m.mods; live.playing = m.playing; emit('tick', m); }
  else if (m.type === 'printed') onPrinted(m);
}

// ---------------------------------------------------------- demo loops -----
function synthLoop(id, sr) {
  const spec = DEMO_LOOPS.find((d) => d.id === id);
  const beat = 60 / spec.bpm, len = Math.round(spec.bars * 4 * beat * sr);
  const L = new Float32Array(len), R = new Float32Array(len);
  let seed = 7 + id.length * 31;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 * 2 - 1; };
  const add = (i, l, r) => { const j = ((i % len) + len) % len; L[j] += l; R[j] += r; };
  const T = (b) => Math.round(b * beat * sr); // beats → samples
  const kick = (b, g = 1, dec = 7) => { const s0 = T(b); let ph = 0; for (let i = 0; i < sr * 0.5; i++) { const t = i / sr; const f = 46 + 110 * Math.exp(-t * 32); ph += 2 * Math.PI * f / sr; const v = Math.sin(ph) * Math.exp(-t * dec) * g * (1 - Math.exp(-t * 900)); const c = Math.tanh(v * 1.6) * 0.75; add(s0 + i, c, c); } };
  const snare = (b, g = 1) => { const s0 = T(b); let lp = 0; for (let i = 0; i < sr * 0.35; i++) { const t = i / sr; const n = rnd(); lp += (n - lp) * 0.55; const tone = Math.sin(2 * Math.PI * 185 * t) * Math.exp(-t * 28) * 0.55; const v = ((n - lp) * Math.exp(-t * 16) * 0.75 + tone) * g * 0.6; add(s0 + i, v * 0.95, v); } };
  const hat = (b, g = 1, open = false) => { const s0 = T(b); let x1 = 0; const dec = open ? 9 : 55; for (let i = 0; i < sr * (open ? 0.4 : 0.08); i++) { const t = i / sr; const n = rnd(); const hp = n - x1; x1 = n; const v = hp * Math.exp(-t * dec) * 0.22 * g; add(s0 + i, v * 0.8, v * 1.1); } };
  const note = (b, dur, midi, g, fn) => { const s0 = T(b), n = Math.round(dur * beat * sr), f = 440 * Math.pow(2, (midi - 69) / 12); fn(s0, n, f, g); };
  if (id === 'break') {
    const sw = 0.06;
    const pat = [[0, 'k', 1], [0.5, 'h', 0.7], [1, 's', 1], [1.5 + sw, 'h', 0.6], [1.75 + sw, 'k', 0.7], [2.25, 'k', 0.8], [2.5, 'h', 0.7], [3, 's', 1], [3.5 + sw, 'h', 0.5], [3.75 + sw, 's', 0.35],
      [4, 'k', 1], [4.5, 'h', 0.7], [5, 's', 1], [5.25 + sw, 's', 0.3], [5.5 + sw, 'k', 0.8], [6, 'h', 0.6], [6.5, 'k', 0.9], [7, 's', 1], [7.5, 'H', 0.6]];
    for (const [b, t, g] of pat) { if (t === 'k') kick(b, g); else if (t === 's') snare(b, g); else hat(b, g, t === 'H'); }

// ---------------------------------------------------------------- graphs ---
const graphEditors = [];
function GraphPanel(g) {
  const src = 'graph' + g, u = 'graph' + g;
  const p = Panel('GRAPH ' + g, { id: 'src-' + src, cls: 'graphcol', tools: [
    h('button', { type: 'button', class: 'icon-btn', title: 'Reset curve', 'aria-label': 'Reset curve', onclick: () => { S.graphs[g - 1] = DSP.DEFAULT_GRAPHS[g - 1].map((q) => ({ ...q })); graphSend(g - 1); } }, '↺'),
    DiceBtn('Random curve', () => { const n = 2 + Math.floor(Math.random() * 6); const pts = []; for (let i = 0; i < n; i++) pts.push({ x: i === 0 ? 0 : Math.random(), y: Math.random(), c: (Math.random() * 2 - 1) * 0.8 }); pts.sort((a, b) => a.x - b.x); S.graphs[g - 1] = pts; graphSend(g - 1); })] });

  const toXY = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
  const hit = (x, y) => { const pts = S.graphs[ed.g], r = cv.getBoundingClientRect(); for (let i = 0; i < pts.length; i++) if (Math.hypot((pts[i].x - x) * r.width, (pts[i].y - y) * r.height) < 11) return i; return -1; };

    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x, y] = toXY(e); const pts = S.graphs[ed.g];
    if (e.button === 2) { const i = hit(x, y); if (i >= 0 && pts.length > 2) { pts.splice(i, 1); graphSend(ed.g); } return; }
    let i = hit(x, y);
    if (i < 0) {
      // near the curve between points? → bend handle; else add point
      let seg = pts.length - 1; for (let k = 0; k < pts.length; k++) if (pts[k].x <= x) seg = k;
      const cy = DSP.evalGraph(pts, x);
      if (Math.abs(cy - y) * cv.getBoundingClientRect().height < 10 && !e.shiftKey && e.detail < 2) { ed.drag = { bend: seg, y0: e.clientY, c0: pts[seg].c || 0 }; return; }

    }

    if (ed.drag.bend !== undefined) { pts[ed.drag.bend].c = Math.max(-1, Math.min(1, ed.drag.c0 + (ed.drag.y0 - e.clientY) / 80 * (pts[(ed.drag.bend + 1) % pts.length].y >= pts[ed.drag.bend].y ? -1 : 1))); graphSend(ed.g); return; }
    const pt = ed.drag.pt; pt.x = Math.max(0, Math.min(0.999, x)); pt.y = Math.max(0, Math.min(1, y));
    pts.sort((a, b) => a.x - b.x); graphSend(ed.g);
  });

  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  p.body.append(cv, h('div', { class: 'kgrid' }, Knob(u + '.len'), Segment(u + '.dir', { labels: ['FWD', 'REV', 'PING'] }), Select(u + '.speed')),

}
function graphSend(i) { post({ type: 'graph', i, points: S.graphs[i] }); markDirty(); }
function drawGraphs() {
  const t = live.tick;
  for (const ed of graphEditors) {
    const cv = ed.cv; if (!cv.isConnected || cv.offsetParent === null) continue;
    const c = cv.getContext('2d'), W = cv.width, H = cv.height, pts = S.graphs[ed.g];
    c.clearRect(0, 0, W, H);
    c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
    for (let k = 1; k < 8; k++) { const x = Math.round(k / 8 * W) + 0.5; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
    for (let k = 1; k < 4; k++) { const y = Math.round(k / 4 * H) + 0.5; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    const pad = 6, ph = H - pad * 2;

    c.lineTo(W, H); c.lineTo(0, H); c.closePath();
    c.fillStyle = cssVar('--mod-fill'); c.fill();
    c.beginPath();

    c.strokeStyle = cssVar('--mod'); c.lineWidth = 2; c.stroke();
    for (const q of pts) { c.beginPath(); c.arc(q.x * W, H - pad - q.y * ph, 5, 0, Math.PI * 2); c.fillStyle = cssVar('--panel'); c.fill(); c.strokeStyle = cssVar('--fg'); c.lineWidth = 1.5; c.stroke(); }

      const v = DEFS['graph' + (ed.g + 1) + '.len']; const len = DSP.normToValue(v.d, P['graph' + (ed.g + 1) + '.len']);
      const sp = [0.25, 0.5, 1, 2, 4][Math.round(P['graph' + (ed.g + 1) + '.speed'] * 4)];
      let x = t.ppq * sp / len; const dir = Math.round(P['graph' + (ed.g + 1) + '.dir'] * 2);

      const y = H - pad - t.src[4 + ed.g] * ph; c.fillStyle = cssVar('--accent'); c.beginPath(); c.arc(x * W, y, 4, 0, Math.PI * 2); c.fill();
    }
  }
}
